
name: Build TikTok SIM Spoof

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract source ZIP
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q "$ZIP" -d source
          else
            cp -r TikTokSimSpoof-main source/ 2>/dev/null || true
          fi

      - name: Build APK
        run: |
          GRADLEW=$(find source . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          DIR=$(dirname "$GRADLEW")
          cd "$DIR"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TikTok-SIM-Spoof-APK
          path: source/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
